name: bff-ml CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check . --output-format=github

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install bff-core from git (private repo)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BFF_CORE_REF: git+https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/mahardhika/bff-core.git@v0.1.0
        run: pip install "$BFF_CORE_REF"
      - name: Install torch (CPU only on CI)
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run pytest
        env:
          DATABASE_MODE: offline
          INFERENCE_PROVIDER: cpu
          LOG_LEVEL: WARNING
        run: |
          python -m pytest tests -q
