[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bff-ml"
version = "0.1.0"
description = "BFF Camera Demo - training pipeline (YOLOX-style detector, 5-class classifier, Supabase sync)."
license = { text = "Apache-2.0" }
requires-python = ">=3.10,<3.13"
authors = [{ name = "BFF Demo Team" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Mining/Construction Industry",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Training-only stack. Torch is heavy; only install where you train.
dependencies = [
    "pyyaml>=6.0",
    "numpy>=1.26",
    "pillow>=10.2",
    "opencv-python-headless>=4.9",
    "boto3>=1.34",
    "botocore>=1.34",
    "supabase>=2.4",
    "python-dotenv>=1.0",
    "loguru>=0.7",
    "tqdm>=4.66",
    "tensorboard>=2.15",
    "albumentations>=1.3",
    "pycocotools>=2.0.7",
    "onnx>=1.15",
    "onnxruntime>=1.17",
    "bff-core>=0.1.0",  # shared storage client + bucket/key naming
]

[project.optional-dependencies]
# GPU training backends.
directml = [
    # torch-directml 0.2.5 is built against the torch 2.4 ABI: a newer
    # torch fails to load the DirectML DLL ("procedure could not be
    # found"), so the version is pinned here.
    "torch-directml>=0.2.5 ; sys_platform == 'win32'",
    "torch==2.4.1 ; sys_platform == 'win32'",
]
cuda = [
    "torch>=2.2",
    "torchvision>=0.17",
]
rocm = [
    "torch>=2.2 ; sys_platform == 'linux'",
]
cpu = [
    "torch>=2.2",
    "torchvision>=0.17",
]
notebook = [
    "jupyter>=1.0",
    "notebook>=7.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
    "mypy>=1.8",
]
all = [
    "bff-ml[cuda,rocm,directml,cpu,notebook,dev]",
]

[project.scripts]
bff-ml = "ml.__main__:main"
bff-ml-train = "ml.__main__:train"
bff-ml-eval = "ml.__main__:eval"
bff-ml-export-onnx = "ml.__main__:export_onnx"
bff-ml-sync = "ml.__main__:sync_results"
bff-ml-list = "ml.__main__:list_models"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["ml*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "gpu: requires GPU provider (cuda, dml, rocm)",
    "network: requires network access (Supabase, S3)",
    "slow: > 30s runtime",
]

[project.urls]
Documentation = "https://github.com/mahardhika/bff-ml/blob/main/README.md"
Source = "https://github.com/mahardhika/bff-ml"
Issues = "https://github.com/mahardhika/bff-ml/issues"
